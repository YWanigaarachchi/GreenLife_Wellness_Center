        <!-- Watchlist Page -->
        <div id="watchlist" class="page">
            <h2 class="page-title">My Watchlist</h2>
            <div class="movie-grid" id="watchlistGrid">
                <!-- Watchlist will be populated by JavaScript -->
            </div>
        </div>
        <script>
            // Watchlist functionality
        function toggleWatchlist(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (movie) {
                movie.inWatchlist = !movie.inWatchlist;
                
                if (document.getElementById('watchlist').classList.contains('active')) {
                    renderWatchlist();
                }
            }
        }

        function renderWatchlist() {
            const watchlistMovies = movies.filter(movie => movie.inWatchlist);
            const watchlistGrid = document.getElementById('watchlistGrid');
            
            if (watchlistMovies.length === 0) {
                watchlistGrid.innerHTML = '<p style="text-align: center; opacity: 0.6; grid-column: 1/-1;">No movies in your watchlist yet. Click on movies to add them!</p>';
                return;
            }

            watchlistGrid.innerHTML = '';
            watchlistMovies.forEach(movie => {
                const movieCard = createMovieCard(movie);
                watchlistGrid.appendChild(movieCard);
            });
        }
        </script>
